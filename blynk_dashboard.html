<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blynk IoT Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #06060f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }

  .db {
    background: #0a0a0f;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #1e1e2e;
    width: 100%;
    max-width: 760px;
  }

  /* ── Header ── */
  .hdr {
    background: #10101a;
    border-bottom: 1px solid #2a1a3e;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hdr-icon {
    width: 42px; height: 42px;
    background: #7c3aed;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; flex-shrink: 0;
  }
  .hdr-title { color: #f0e6ff; font-size: 18px; font-weight: 600; letter-spacing: .4px; }
  .hdr-sub   { color: #5a4a7a; font-size: 11px; margin-top: 2px; }
  .hdr-ping  { margin-left: auto; display: flex; align-items: center; gap: 7px; color: #5a4a7a; font-size: 12px; }
  .ping      { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1.8s infinite; }
  .ping.ok   { background: #7c3aed; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ── Body grid ── */
  .body {
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media(max-width:520px){ .body{ grid-template-columns:1fr; } }
  .full { grid-column: 1 / -1; }

  /* ── Card base ── */
  .card {
    background: #12121e;
    border: 1px solid #1e1a30;
    border-radius: 14px;
    padding: 18px 20px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px; border-radius: 14px 14px 0 0;
    background: #7c3aed;
  }
  .card.red::before { background: #ef4444; }

  /* ── Label ── */
  .lbl {
    font-size: 10px; letter-spacing: 1.8px; font-weight: 600;
    color: #7c3aed; text-transform: uppercase;
    display: flex; align-items: center; gap: 5px;
    margin-bottom: 14px;
  }
  .lbl.red { color: #ef4444; }
  .lbl i   { font-size: 14px; }
  .lbl-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .lbl-row .lbl { margin-bottom: 0; }

  /* ── Badge ── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 600;
  }
  .b-ok   { background: #1a1030; color: #c4b5fd; border: 1px solid #2e1a50; }
  .b-err  { background: #1e0a0a; color: #f87171; border: 1px solid #3e1a1a; }
  .b-wait { background: #181218; color: #5a4a7a;  border: 1px solid #2a1a3e; }

  /* ── Power button ── */
  .pw-btn {
    width: 100%; padding: 14px;
    border-radius: 11px; border: 1.5px solid #2a1a3e;
    background: #0a0a0f; color: #e0d4f7;
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: .18s all; letter-spacing: .3px;
  }
  .pw-btn.on  { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .pw-btn:hover      { border-color: #7c3aed; color: #c4b5fd; }
  .pw-btn.on:hover   { background: #6d28d9; }
  .pw-btn:active     { transform: scale(.97); }
  .pw-sub { font-size: 11px; color: #3d2d5a; text-align: center; margin-top: 8px; }

  /* ── Slider ── */
  .sl-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .sl-num  { font-size: 32px; font-weight: 700; color: #ef4444; }
  .sl-unit { font-size: 13px; color: #3d2d4a; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 6px; background: #1e1a30; border-radius: 6px;
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: #ef4444; border: 3px solid #0a0a0f;
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #ef4444; border: 3px solid #0a0a0f;
    cursor: pointer;
  }
  .sl-marks { display: flex; justify-content: space-between; font-size: 10px; color: #2e1a3e; margin-top: 6px; }

  /* ── LED ── */
  .led-row { display: flex; align-items: center; gap: 14px; }
  .led-bulb {
    width: 56px; height: 56px; border-radius: 50%;
    border: 2px solid #1e1a30;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; transition: .3s all;
    color: #2e1a3e;
  }
  .led-bulb.on { border-color: #7c3aed; color: #c4b5fd; background: #1a1030; }
  .led-name { font-size: 18px; font-weight: 600; color: #e0d4f7; }
  .led-desc { font-size: 11px; color: #3d2d5a; margin-top: 4px; }
  .led-btns { display: flex; gap: 8px; margin-top: 12px; }
  .lbtn {
    flex: 1; padding: 9px; border-radius: 9px;
    border: 1px solid #1e1a30; background: #0a0a0f;
    color: #5a4a7a; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: .15s all;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .lbtn.act { background: #1a1030; border-color: #7c3aed; color: #c4b5fd; }
  .lbtn:hover { border-color: #7c3aed55; }

  /* ── Gauge ── */
  .gauge-wrap  { display: flex; flex-direction: column; align-items: center; }
  .g-svg       { width: 100%; max-width: 170px; }
  .g-val       { font-size: 30px; font-weight: 700; color: #ef4444; text-align: center; margin-top: -8px; }
  .g-unit      { font-size: 13px; color: #3d2d4a; }
  .g-minmax    { display: flex; justify-content: space-between; width: 100%; font-size: 10px; color: #2e1a3e; margin-top: 6px; }

  /* ── Message / label ── */
  .msg-box {
    background: #0a0a0f; border: 1px solid #1e1a30;
    border-radius: 10px; padding: 14px; min-height: 56px;
    display: flex; align-items: center; gap: 11px;
  }
  .msg-icon { color: #7c3aed; font-size: 20px; flex-shrink: 0; }
  .msg-txt  { font-size: 15px; color: #e0d4f7; flex: 1; word-break: break-word; }
  .msg-time { font-size: 10px; color: #2e1a3e; margin-top: 4px; }
  .inp-row  { display: flex; gap: 8px; margin-top: 10px; }
  .txt-in {
    flex: 1; background: #0a0a0f; border: 1px solid #1e1a30;
    border-radius: 9px; padding: 10px 13px;
    color: #e0d4f7; font-size: 13px; outline: none;
  }
  .txt-in:focus { border-color: #7c3aed66; }
  .snd-btn {
    padding: 10px 18px; background: #7c3aed; border: none;
    border-radius: 9px; color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    transition: .15s; white-space: nowrap;
  }
  .snd-btn:hover  { background: #6d28d9; }
  .snd-btn:active { transform: scale(.97); }

  /* ── Footer ── */
  .foot {
    padding: 12px 22px; border-top: 1px solid #121218;
    display: flex; justify-content: space-between; align-items: center;
    color: #2e1a3e; font-size: 11px;
  }
  .acc { color: #7c3aed; }
</style>
</head>
<body>

<div class="db">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-icon"><i class="ti ti-cpu-2"></i></div>
    <div>
      <div class="hdr-title">Blynk IoT Dashboard</div>
      <div class="hdr-sub">token: 6e5vmP…sOsyNW &nbsp;·&nbsp; blynk.cloud</div>
    </div>
    <div class="hdr-ping">
      <span class="ping" id="ping-dot"></span>
      <span id="ping-txt">กำลังเชื่อมต่อ</span>
    </div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- ปุ่มเปิด/ปิด  V0 -->
    <div class="card">
      <div class="lbl"><i class="ti ti-power"></i>ปุ่มเปิด/ปิด</div>
      <button class="pw-btn" id="pw-btn" onclick="togglePower()">
        <i class="ti ti-power" id="pw-icon"></i>
        <span id="pw-txt">กำลังโหลด...</span>
      </button>
      <div class="pw-sub" id="pw-sub">V0 · กำลังดึงสถานะ</div>
    </div>

    <!-- สถานะการทำงาน  V1 -->
    <div class="card">
      <div class="lbl-row">
        <div class="lbl"><i class="ti ti-activity"></i>สถานะการทำงาน</div>
        <span class="badge b-wait" id="led-badge"><i class="ti ti-dots"></i> V1</span>
      </div>
      <div class="led-row">
        <div class="led-bulb" id="led-bulb">
          <i class="ti ti-bolt" id="led-ico"></i>
        </div>
        <div>
          <div class="led-name" id="led-name">—</div>
          <div class="led-desc" id="led-desc">กำลังตรวจสอบ</div>
        </div>
      </div>
      <div class="led-btns">
        <button class="lbtn" id="l-on"  onclick="setLed(1)"><i class="ti ti-check"></i> เปิด (1)</button>
        <button class="lbtn" id="l-off" onclick="setLed(0)"><i class="ti ti-x"></i> ปิด (0)</button>
      </div>
    </div>

    <!-- ปรับค่าแสง  V2 (full width) -->
    <div class="card red full">
      <div class="lbl-row">
        <div class="lbl red"><i class="ti ti-sun"></i>ปรับค่าแสง</div>
        <span class="badge b-wait" id="sl-badge"><i class="ti ti-dots"></i> V2</span>
      </div>
      <div class="sl-row">
        <span class="sl-num" id="sl-num">—</span>
        <span class="sl-unit">/ 255</span>
      </div>
      <input type="range" min="0" max="255" step="1" id="sl" value="128"
             oninput="onSl(this.value)" onchange="sendSl(this.value)">
      <div class="sl-marks"><span>0 – มืด</span><span>128 – กลาง</span><span>255 – สว่าง</span></div>
    </div>

    <!-- ค่าอุณหภูมิ  V3 -->
    <div class="card red">
      <div class="lbl red"><i class="ti ti-thermometer"></i>ค่าอุณหภูมิ</div>
      <div class="gauge-wrap">
        <svg viewBox="0 0 160 90" class="g-svg">
          <path d="M16,80 A64,64 0 0,1 144,80" fill="none" stroke="#1e1a30" stroke-width="10" stroke-linecap="round"/>
          <path id="g-arc"    d="M16,80 A64,64 0 0,1 144,80" fill="none" stroke="#ef4444" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="0 201"
                style="transition:stroke-dasharray .6s ease;"/>
          <line id="g-needle" x1="80" y1="80" x2="80" y2="26"
                stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"
                style="transform-origin:80px 80px;transform:rotate(0deg);transition:transform .6s ease;"/>
          <circle cx="80" cy="80" r="5" fill="#ef4444"/>
        </svg>
        <div class="g-val"><span id="g-val">—</span><span class="g-unit"> °C</span></div>
        <div class="g-minmax"><span>0 °C</span><span>50 °C</span><span>100 °C</span></div>
      </div>
    </div>

    <!-- การตอบกลับ  V4 -->
    <div class="card">
      <div class="lbl-row">
        <div class="lbl"><i class="ti ti-message-2"></i>การตอบกลับ</div>
        <span class="badge b-wait" id="msg-badge"><i class="ti ti-dots"></i> V4</span>
      </div>
      <div class="msg-box">
        <i class="ti ti-quote msg-icon"></i>
        <div>
          <div class="msg-txt"  id="msg-txt">กำลังโหลด...</div>
          <div class="msg-time" id="msg-time">V4 · string</div>
        </div>
      </div>
      <div class="inp-row">
        <input type="text" class="txt-in" id="msg-in" placeholder="พิมพ์ข้อความ..." value="Hello">
        <button class="snd-btn" onclick="sendMsg()">
          <i class="ti ti-send"></i> ส่ง
        </button>
      </div>
    </div>

  </div><!-- /body -->

  <div class="foot">
    <span>Blynk Cloud · <span class="acc">blynk.cloud/external/api</span></span>
    <span id="upd-time">—</span>
  </div>

</div><!-- /db -->

<script>
  const TOKEN = '6e5vmPTb0ZiGFMoZcucdNQSZABSOsyNW';
  const BASE  = 'https://blynk.cloud/external/api';
  let curPwr  = 0;

  /* ── Helpers ── */
  function ts() {
    return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function setUpdTime() {
    document.getElementById('upd-time').textContent = 'อัปเดต: ' + ts();
  }
  function badge(id, ok, txt) {
    const e = document.getElementById(id);
    const icon = ok === null ? 'dots' : ok ? 'check' : 'x';
    e.className = 'badge ' + (ok === null ? 'b-wait' : ok ? 'b-ok' : 'b-err');
    e.innerHTML = `<i class="ti ti-${icon}"></i> ${txt}`;
  }

  /* ── Blynk API ── */
  async function blynkGet(pin) {
    const r = await fetch(`${BASE}/get?token=${TOKEN}&${pin}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    return t.replace(/[\[\]"]/g, '').trim();
  }
  async function blynkSet(pin, val) {
    const r = await fetch(`${BASE}/update?token=${TOKEN}&${pin}=${val}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
  }

  /* ── Power  V0 ── */
  function renderPower(v) {
    curPwr = parseInt(v) || 0;
    const btn = document.getElementById('pw-btn');
    const txt = document.getElementById('pw-txt');
    btn.className = 'pw-btn' + (curPwr ? ' on' : '');
    txt.textContent = curPwr ? 'เปิดอยู่' : 'ปิดอยู่';
    document.getElementById('pw-sub').textContent = `V0 = ${curPwr} · ${ts()}`;
  }
  async function togglePower() {
    const nv = curPwr ? 0 : 1;
    document.getElementById('pw-txt').textContent = 'กำลังส่ง...';
    try {
      await blynkSet('V0', nv);
      renderPower(nv);
      setUpdTime();
    } catch (e) {
      document.getElementById('pw-sub').textContent = 'ข้อผิดพลาด: ' + e.message;
    }
  }

  /* ── Slider  V2 ── */
  function onSl(v) {
    document.getElementById('sl-num').textContent = Math.round(v);
    badge('sl-badge', null, 'รอ');
  }
  let slTimer;
  async function sendSl(v) {
    clearTimeout(slTimer);
    slTimer = setTimeout(async () => {
      const n = Math.round(v);
      badge('sl-badge', null, 'กำลังส่ง...');
      try {
        await blynkSet('V2', n);
        badge('sl-badge', true, 'V2 = ' + n);
        setUpdTime();
      } catch (e) {
        badge('sl-badge', false, 'ผิดพลาด');
      }
    }, 300);
  }

  /* ── LED  V1 ── */
  function renderLed(v) {
    const n = parseInt(v) || 0;
    document.getElementById('led-bulb').className = 'led-bulb' + (n ? ' on' : '');
    document.getElementById('led-name').textContent = n ? 'กำลังทำงาน' : 'หยุดทำงาน';
    document.getElementById('led-desc').textContent = n ? 'ระบบออนไลน์ · V1 = 1' : 'ระบบออฟไลน์ · V1 = 0';
    document.getElementById('l-on').className  = 'lbtn' + (n ? ' act' : '');
    document.getElementById('l-off').className = 'lbtn' + (n ? '' : ' act');
    badge('led-badge', true, 'V1 = ' + n);
  }
  async function setLed(v) {
    try {
      await blynkSet('V1', v);
      renderLed(v);
      setUpdTime();
    } catch (e) { console.error(e); }
  }

  /* ── Gauge  V3 ── */
  function renderGauge(v) {
    const n = Math.min(100, Math.max(0, Math.round(parseFloat(v) || 0)));
    document.getElementById('g-val').textContent = n;
    const arcLen = 200;
    document.getElementById('g-arc').setAttribute('stroke-dasharray', `${(n / 100) * arcLen} ${arcLen}`);
    document.getElementById('g-needle').style.transform = `rotate(${-90 + (n / 100) * 180}deg)`;
  }

  /* ── Label  V4 ── */
  async function sendMsg() {
    const t = document.getElementById('msg-in').value.trim();
    if (!t) return;
    badge('msg-badge', null, 'กำลังส่ง...');
    try {
      await blynkSet('V4', encodeURIComponent(t));
      document.getElementById('msg-txt').textContent  = t;
      document.getElementById('msg-time').textContent = 'V4 · ส่งเมื่อ ' + ts();
      badge('msg-badge', true, 'ส่งแล้ว');
      setUpdTime();
    } catch (e) {
      badge('msg-badge', false, 'ผิดพลาด');
    }
  }

  /* ── Init: load current values ── */
  async function init() {
    const dot  = document.getElementById('ping-dot');
    const ptxt = document.getElementById('ping-txt');
    try {
      /* V0 – switch */
      const v0 = await blynkGet('V0');
      renderPower(v0);

      /* V2 – brightness */
      const v2 = await blynkGet('V2');
      const n2 = Math.round(parseFloat(v2) || 0);
      document.getElementById('sl').value = n2;
      document.getElementById('sl-num').textContent = n2;
      badge('sl-badge', true, 'V2 = ' + n2);

      /* V3 – temperature (read-only display; default 55 if not available) */
      let v3 = 55;
      try { v3 = await blynkGet('V3'); } catch(_) {}
      renderGauge(v3);

      /* V4 – label (read-only display) */
      let v4 = 'Hello';
      try { v4 = await blynkGet('V4'); } catch(_) {}
      document.getElementById('msg-txt').textContent  = v4 || '(ว่าง)';
      document.getElementById('msg-time').textContent = 'V4 · โหลดเมื่อ ' + ts();
      badge('msg-badge', true, 'พร้อม');

      /* LED default off */
      renderLed(0);

      dot.className = 'ping ok';
      ptxt.textContent = 'เชื่อมต่อแล้ว';
      setUpdTime();

    } catch (e) {
      dot.style.background = '#ef4444';
      ptxt.textContent = 'เชื่อมต่อไม่ได้';
      document.getElementById('pw-sub').textContent = 'CORS หรือ token ไม่ถูกต้อง · ' + e.message;
      console.error('Blynk init error:', e);
    }
  }

  init();
</script>

</body>
</html>
